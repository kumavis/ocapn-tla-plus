\* MC: inter-vat promise-to-promise shortening under NaivePromiseResolution
\* (notes/path-changes.md §1.2.b, Phase A).  Two-party form: resolver vatB
\* emits desc:export-promise to its listener vatA, which also happens to
\* host the new promise (p_2 = LocalPromise on vatA).  Listener installs
\* localResolution immediately (Naive == no flush); new race surface
\* between in-flight forwards on the old path through vatB and direct
\* sends on the new path through vatA's local p_2 queue.
\* Expected outcome: EndToEndRefFIFO_MC is violated.
